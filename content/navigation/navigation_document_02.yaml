id: navigation_document_02
order: 11
title: Archive Expedition
lesson: Line and Document Motion
region: Navigation
narrative: >
  The quest archive mixes indented code, headings, and prose.
  Combine line-scale and document-scale jumps to survey it.
objective: Combine line and document motions to visit six stations.
start_text:
  - "QUEST ARCHIVE"
  - ""
  - "  find the lost map"
  - "  open the iron gate"
  - "Section One: arrivals"
  - "The traveller entered the hall at dawn."
  - ""
  - "Section Two: trials"
  - "  light the silver rune"
  - ""
  - "ARCHIVE FOOTER"
start_cursor: [0, 0]
targets:
  - {row: 2, col: 2, label: "first non-blank of the indented line"}
  - {row: 4, col: 20, label: "end of 'Section One: arrivals'"}
  - {row: 0, col: 0, label: "top of the document"}
  - {row: 10, col: 0, label: "bottom of the document"}
  - {row: 8, col: 0, label: "absolute beginning of the indented line"}
  - {row: 8, col: 2, label: "first non-blank of that same line"}
allowed_commands: [h, j, k, l, "0", ^, $, gg, G]
introduced: []
hints:
  - "Reach the indented line, then press '^'."
  - "After the footer, step up and use '0' before '^' to feel the difference."
reference_actions: 13
mastery:
  required_keys: ["0", ^, $, gg, G]
