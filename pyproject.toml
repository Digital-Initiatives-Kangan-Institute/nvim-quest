[project]
name = "nvim-quest"
version = "0.1.0"
description = "NeoVim Quest - console-based learning game"
requires-python = ">=3.10"
dependencies = [
  "textual>=0.86",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
nvim-quest = "nvim_quest.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nvim_quest = ["content/**/*.yaml"]
